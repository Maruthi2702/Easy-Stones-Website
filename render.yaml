services:
  - type: web
    name: easystones
    env: node
    buildCommand: npm install --production=false && npm run build
    startCommand: node server.ts
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # File storage (src/services/fileStore.ts). FILE_STORE=s3 sends new uploads to
      # the S3 bucket behind CloudFront (aws-infra files stack outputs BucketName and
      # CdnUrl); unset or "cloudinary" keeps them on Cloudinary. Keep the CLOUDINARY_*
      # keys while old files are still there: deletes of those still go to Cloudinary.
      # VITE_FILES_CDN_URL is read at build time (redeploy after changing it).
      - key: FILE_STORE
        sync: false
      - key: FILES_BUCKET
        sync: false
      - key: FILES_CDN_URL
        sync: false
      - key: VITE_FILES_CDN_URL
        sync: false
      - key: AWS_REGION
        value: us-east-2
      # The files stack's IAM user (easy-surfaces-dev-files-uploader): create its
      # access key in the AWS console and paste both halves here. The email stack
      # lets the same user send through SES.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Email (src/services/emailService.ts): Amazon SES first, the Gmail SMTP
      # account below as the backup. SES is off until SES_FROM_EMAIL is set — an
      # address on the domain the aws-infra email stack verifies (output FromAddress);
      # SES_CONFIGURATION_SET is its ConfigurationSetName output.
      - key: SES_FROM_EMAIL
        sync: false
      - key: SES_CONFIGURATION_SET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://easystones.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Maps & geocoding. Unrelated to the OAuth pair above — a different key
      # entirely, with Maps JavaScript API and Geocoding API enabled on it.
      # VITE_ vars are read at build time, not run time, so changing this one
      # needs a redeploy rather than a restart.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_GEOCODING_API_KEY
        sync: false
